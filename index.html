<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/site.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VinMapInfo</title>
  <link rel="manifest" href="/manifest.json" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js').then((registration) => {
          registration.onupdatefound = () => {
            const installingWorker = registration.installing;
            if (installingWorker) {
              installingWorker.onstatechange = () => {
                if (installingWorker.state === 'installed') {
                  if (navigator.serviceWorker.controller) {
                    // New content is available; notify the user
                    console.log('New version available. Please refresh.');
                    // show a notification or dialog to the user
                    const notification = document.createElement('div');
                    notification.style.position = 'fixed';
                    notification.style.bottom = '20px';
                    notification.style.right = '20px';
                    notification.style.backgroundColor = '#f8d7da';
                    notification.style.color = '#721c24';
                    notification.style.padding = '15px';
                    notification.style.border = '1px solid #f5c6cb';
                    notification.style.borderRadius = '5px';
                    notification.innerText = 'New version available';

                    const refreshButton = document.createElement('button');
                    refreshButton.innerText = 'Refresh';
                    refreshButton.style.marginLeft = '10px';
                    refreshButton.style.background = 'white';
                    refreshButton.onclick = () => {
                      window.location.reload();
                      notification.remove();
                    };

                    notification.appendChild(refreshButton);
                    document.body.appendChild(notification);


                  } else {
                    console.log('Content is cached for offline use.');
                  }
                }
              };
            }
          };
        });
      });
    }
  </script>
</body>

</html>
